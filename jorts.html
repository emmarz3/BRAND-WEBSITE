<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shorts - My Business Brand</title>
  <link rel="stylesheet" href="pp.css">
  <link rel="stylesheet" href="watermark.css">
</head>
<body>
  <header>
    <h1>Our Shorts Collection</h1>
    <nav class="navbar">
      <a href="index1.html">Home</a>
      <a href="products.html">Products</a>
      <a href="contact.html">Contact</a>
      <a href="#" class="cart-icon" onclick="openCart(); return false;">
        🛒 Cart
        <span class="cart-count">0</span>
      </a>
    </nav>
    <div class="sub-navbar">
      <a href="jorts.html" class="active">Jorts</a>
      <a href="jewelry.html">Jewelries</a>
      <a href="jersey.html">Jerseys</a>
    </div>
  </header>

  <section id="products">
    <div class="product">
      <h3>Bermuda Shorts</h3>
      <img src="1\bermuda.jpg" alt="Short 1">
      <p class="price">₦10,000</p>
      <button onclick="addToCart('Bermuda Shorts', 10000, '1\\bermuda.jpg')">Add to Cart</button>
    </div>
    <div class="product">
      <h3>Men's Grunge Punk Chain Pattern Casual Denim Shorts</h3>
      <img src="1\Men's Grunge Punk Chain Pattern Casual Denim Shorts Jorts, Daily Wear.jpg" alt="Short 2">
      <p class="price">₦12,000</p>
      <button onclick="addToCart('Grunge Punk Chain Denim Shorts', 12000, '1\\Men\'s Grunge Punk Chain Pattern Casual Denim Shorts Jorts, Daily Wear.jpg')">Add to Cart</button>
    </div>
  </section>

  <!-- Cart Modal -->
  <div id="cart-modal" class="cart-modal">
    <div class="cart-modal-content">
      <div class="cart-modal-header">
        <h2>🛒 Shopping Cart</h2>
        <button class="close-cart" onclick="closeCart()">&times;</button>
      </div>
      <div id="cart-items" class="cart-items">
        <p class="empty-cart">Your cart is empty!</p>
      </div>
      <div class="cart-modal-footer">
        <h3 id="cart-total">Total: ₦0</h3>
        <div class="cart-buttons">
          <button onclick="clearCart()" class="clear-cart-btn">Clear Cart</button>
          <button onclick="downloadReceipt()" class="receipt-btn">Download Receipt</button>
          <button onclick="checkout()" class="checkout-btn">Checkout</button>
        </div>
      </div>
    </div>
  </div>

  <script src="cart.js"></script>
  <script src="watermark.js"></script>
</body>
</html>
