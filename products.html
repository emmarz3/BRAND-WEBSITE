    </div>
    <script>
        // Initialize cart array
        let cart = [];

        // Function to add item to cart
        function addToCart(name, price) {
            cart.push({ name: name, price: price });
            updateCart();
            alert(name + " added to cart!");
        }

        // Function to remove item from cart
        function removeFromCart(index) {
            cart.splice(index, 1); // Remove item at specific index
            updateCart();
        }

        // Function to update cart display
        function updateCart() {
            const cartItemsDiv = document.getElementById('cart-items');
            const totalPriceSpan = document.getElementById('total-price');
            const checkoutBtn = document.getElementById('checkout-button');
            const customerDetails = document.getElementById('customer-details');
            
            let html = '';
            let total = 0;

            if (cart.length === 0) {
                cartItemsDiv.innerHTML = '<p class="empty-cart">Your cart is empty</p>';
                checkoutBtn.style.display = 'none';
                customerDetails.style.display = 'none';
            } else {
                cart.forEach((item, index) => {
                    total += item.price;
                    html += `
                        <div class="cart-item">
                            <span>${item.name}</span>
                            <span>
                                $${item.price} 
                                <button class="remove-btn" onclick="removeFromCart(${index})">Remove</button>
                            </span>
                        </div>
                    `;
                });
                
                cartItemsDiv.innerHTML = html;
                checkoutBtn.style.display = 'block';
                customerDetails.style.display = 'block';
            }

            totalPriceSpan.innerText = total;
        }

        // Initialize cart display on page load
        updateCart();

        // ---------------------------------------------------------
        // STRIPE CHECKOUT INTEGRATION
        // ---------------------------------------------------------
        
        // REPLACE THIS with your Stripe Publishable Key
        var stripe = Stripe('pk_test_YOUR_PUBLISHABLE_KEY_HERE');

        document.getElementById("checkout-button").addEventListener("click", function() {
            var name = document.getElementById("cust-name").value;
            var email = document.getElementById("cust-email").value;

            if(cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }
            
            if(!name || !email) {
                alert("Please enter your name and email.");
                return;
            }

            // Send data to create checkout session
            fetch("create_checkout_session.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    cart: cart,
                    name: name,
                    email: email
                })
            })
            .then(function(response) {
                return response.json();
            })
            .then(function(session) {
                if(session.error) {
                    alert(session.error);
                } else {
                    // Redirect to Stripe
                    return stripe.redirectToCheckout({ sessionId: session.id });
                }
            })
            .then(function(result) {
                if (result.error) {
                    alert(result.error.message);
                }
            })
            .catch(function(error) {
                console.error("Error:", error);
                alert("Something went wrong. Make sure the backend files are set up correctly.");
            });
        });
    </script>
  </section>


  <script src="script.js"></script>
