<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - My Business Brand</title>
  <link rel="stylesheet" href="pp.css">
  <link rel="stylesheet" href="watermark.css">
</head>
<style>
  /* Contact Section Styles */
  .contact-container {
    max-width: 800px;
    margin: 2rem auto;
    padding: 2rem;
    animation: fadeIn 1s ease;
  }

  .contact-header {
    text-align: center;
    margin-bottom: 2rem;
  }

  .contact-header h1 {
    color: #d81b60;
    font-size: clamp(1.8rem, 4vw, 2.5rem);
    margin-bottom: 0.5rem;
  }

  .contact-header p {
    color: #ad1457;
    font-size: 1.1rem;
  }

  /* Contact Info Cards */
  .contact-info {
    display: flex;
    flex-wrap: wrap;
    gap: 1.5rem;
    justify-content: center;
    margin-bottom: 2rem;
  }

  .contact-card {
    background: rgba(255, 255, 255, 0.7);
    border: 2px solid #f48fb1;
    border-radius: 12px;
    padding: 1.5rem;
    text-align: center;
    flex: 1;
    min-width: 200px;
    max-width: 300px;
    box-shadow: 0 0 15px rgba(216, 27, 96, 0.2);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .contact-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 0 25px rgba(216, 27, 96, 0.5);
  }

  .contact-card-icon {
    font-size: 2.5rem;
    margin-bottom: 10px;
  }

  .contact-card h3 {
    color: #d81b60;
    margin-bottom: 0.5rem;
  }

  .contact-card p {
    color: #4a004e;
    font-weight: bold;
  }

  .contact-card a {
    color: #ad1457;
    text-decoration: none;
    transition: color 0.3s ease;
  }

  .contact-card a:hover {
    color: #d81b60;
  }

  /* Contact Form */
  .contact-form-wrapper {
    background: rgba(255, 255, 255, 0.7);
    border: 2px solid #f48fb1;
    border-radius: 15px;
    padding: 2rem;
    box-shadow: 0 0 20px rgba(216, 27, 96, 0.3);
  }

  .contact-form-wrapper h2 {
    color: #d81b60;
    margin-bottom: 1.5rem;
    text-align: center;
    font-size: 1.5rem;
  }

  .form-group {
    margin-bottom: 1.5rem;
  }

  .form-group label {
    display: block;
    color: #4a004e;
    font-weight: bold;
    margin-bottom: 0.5rem;
    font-size: 1rem;
  }

  .form-group input,
  .form-group textarea,
  .form-group select {
    width: 100%;
    padding: 12px 15px;
    border: 2px solid #f48fb1;
    border-radius: 8px;
    font-size: 1rem;
    font-family: inherit;
    background: white;
    color: #4a004e;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }

  .form-group input:focus,
  .form-group textarea:focus,
  .form-group select:focus {
    outline: none;
    border-color: #d81b60;
    box-shadow: 0 0 10px rgba(216, 27, 96, 0.3);
  }

  .form-group textarea {
    min-height: 150px;
    resize: vertical;
  }

  .form-group .required {
    color: #d81b60;
  }

  /* Submit Buttons */
  .form-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    justify-content: center;
  }

  .submit-btn {
    background: linear-gradient(90deg, #f48fb1, #d81b60);
    color: white;
    border: none;
    padding: 15px 30px;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .submit-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(216, 27, 96, 0.5);
  }

  .whatsapp-btn {
    background: linear-gradient(90deg, #25D366, #128C7E);
  }

  .whatsapp-btn:hover {
    box-shadow: 0 0 20px rgba(37, 211, 102, 0.5);
  }

  /* Success/Error Messages */
  .message {
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 1rem;
    display: none;
  }

  .message.success {
    background: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
    display: block;
  }

  .message.error {
    background: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
    display: block;
  }

  /* Complaint Category */
  .category-options {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .category-option {
    background: white;
    border: 2px solid #f48fb1;
    border-radius: 20px;
    padding: 8px 16px;
    cursor: pointer;
    transition: all 0.3s ease;
    color: #4a004e;
  }

  .category-option:hover,
  .category-option.selected {
    background: #d81b60;
    color: white;
    border-color: #d81b60;
  }

  /* Animations */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Responsive */
  @media (max-width: 768px) {
    .contact-container {
      padding: 1rem;
    }

    .contact-card {
      min-width: 100%;
    }

    .form-buttons {
      flex-direction: column;
    }

    .submit-btn {
      width: 100%;
      justify-content: center;
    }
  }
</style>
</head>
<body>
  <header>
    <div class="logo">My Business Brand</div>
    <nav class="navbar">
      <a href="index1.html">Home</a>
      <a href="products.html">Products</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
    <div class="sub-navbar">
      <a href="jorts.html">Jorts</a>
      <a href="jewelry.html">Jewelries</a>
      <a href="jersey.html">Jerseys</a>
    </div>
  </header>

  <section id="contact">
    <div class="contact-container">
      <div class="contact-header">
        <h1>Contact Us</h1>
        <p>We'd love to hear from you! Send us your complaints, feedback, or inquiries.</p>
      </div>

      <!-- Contact Info Cards -->
      <div class="contact-info">
        <div class="contact-card">
          <div class="contact-card-icon">📧</div>
          <h3>Email</h3>
          <p><a href="mailto:abisolaemmanuel961@gmail.com">abisolaemmanuel961@gmail.com</a></p>
        </div>
        <div class="contact-card">
          <div class="contact-card-icon">💬</div>
          <h3>WhatsApp</h3>
<p><a href="https://wa.me/2347025305441" target="_blank" rel="noopener noreferrer">+234 702 530 5441</a></p>
        </div>
      </div>

      <!-- Contact Form -->
      <div class="contact-form-wrapper">
        <h2>Send us a Message</h2>
        
        <div id="messageBox" class="message"></div>

        <form id="contactForm">
          <!-- Name -->
          <div class="form-group">
            <label for="name">Your Name <span class="required">*</span></label>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required>
          </div>

          <!-- Email -->
          <div class="form-group">
            <label for="email">Your Email <span class="required">*</span></label>
            <input type="email" id="email" name="email" placeholder="Enter your email address" required>
          </div>

          <!-- Phone -->
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">
          </div>

          <!-- Category -->
          <div class="form-group">
            <label for="category">Complaint Category <span class="required">*</span></label>
            <select id="category" name="category" required>
              <option value="">Select a category</option>
              <option value="product">Product Issue</option>
              <option value="order">Order Problem</option>
              <option value="delivery">Delivery Issue</option>
              <option value="payment">Payment Problem</option>
              <option value="feedback">Feedback</option>
              <option value="other">Other</option>
            </select>
          </div>

          <!-- Subject -->
          <div class="form-group">
            <label for="subject">Subject <span class="required">*</span></label>
            <input type="text" id="subject" name="subject" placeholder="Enter message subject" required>
          </div>

          <!-- Message -->
          <div class="form-group">
            <label for="message">Your Message <span class="required">*</span></label>
            <textarea id="message" name="message" placeholder="Describe your complaint or message in detail..." required></textarea>
          </div>

          <!-- Form Buttons -->
          <div class="form-buttons">
            <button type="submit" class="submit-btn">
              <span>📧</span> Send via Email
            </button>
            <button type="button" class="submit-btn whatsapp-btn" onclick="sendViaWhatsApp()">
              <span>💬</span> Send via WhatsApp
            </button>
          </div>
        </form>
      </div>
    </div>
  </section>

  <script src="watermark.js"></script>
  
  <script>
    // Contact Form Handling
    document.getElementById('contactForm').addEventListener('submit', function(e) {
      e.preventDefault();
      sendViaEmail();
    });

    // Function to send message via Email (mailto)
    function sendViaEmail() {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const category = document.getElementById('category').value;
      const subject = document.getElementById('subject').value.trim();
      const message = document.getElementById('message').value.trim();

      // Validation
      if (!name || !email || !category || !subject || !message) {
        showMessage('Please fill in all required fields.', 'error');
        return;
      }

      // Validate email format
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        showMessage('Please enter a valid email address.', 'error');
        return;
      }

      // Create email subject and body
      const emailSubject = encodeURIComponent(`[${category.toUpperCase()}] ${subject} - From: ${name}`);
      const emailBody = encodeURIComponent(
        `Hello,\n\n` +
        `Name: ${name}\n` +
        `Email: ${email}\n` +
        `Phone: ${phone || 'Not provided'}\n` +
        `Category: ${category}\n` +
        `Subject: ${subject}\n\n` +
        `Message:\n${message}\n\n` +
        `--- This message was sent from My Business Brand Contact Form ---`
      );

      // Open email client
      window.location.href = `mailto:abisolaemmanuel961@gmail.com?subject=${emailSubject}&body=${emailBody}`;
      
      showMessage('Email client opened! Please send the email to complete your request.', 'success');
      
      // Reset form after sending
      setTimeout(() => {
        document.getElementById('contactForm').reset();
      }, 1000);
    }

    // Function to send message via WhatsApp
    function sendViaWhatsApp() {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const category = document.getElementById('category').value;
      const subject = document.getElementById('subject').value.trim();
      const message = document.getElementById('message').value.trim();

      // Validation
      if (!name || !category || !subject || !message) {
        showMessage('Please fill in all required fields (Name, Category, Subject, Message).', 'error');
        return;
      }

      // Format WhatsApp message
      const whatsappMessage = 
        `*NEW MESSAGE FROM CUSTOMER*\n\n` +
        `*Name:* ${name}\n` +
        `*Email:* ${email || 'Not provided'}\n` +
        `*Phone:* ${phone || 'Not provided'}\n` +
        `*Category:* ${category}\n` +
        `*Subject:* ${subject}\n\n` +
        `*Message:*\n${message}\n\n` +
        `--- Sent from My Business Brand ---`;

      // Encode message for WhatsApp
      const encodedMessage = encodeURIComponent(whatsappMessage);
      
      // Open WhatsApp with pre-filled message
      window.open(`https://wa.me/2347025305441?text=${encodedMessage}`, '_blank');
      
      showMessage('WhatsApp opened! Send the message to complete your request.', 'success');
      
      // Reset form after sending
      setTimeout(() => {
        document.getElementById('contactForm').reset();
      }, 1000);
    }

    // Show message function
    function showMessage(text, type) {
      const messageBox = document.getElementById('messageBox');
      messageBox.textContent = text;
      messageBox.className = 'message ' + type;
      
      // Hide message after 5 seconds
      setTimeout(() => {
        messageBox.className = 'message';
        messageBox.style.display = 'none';
      }, 5000);
    }
  </script>
</body>
</html>
