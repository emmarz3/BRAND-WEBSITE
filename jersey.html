<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jerseys - My Business Brand</title>
  <link rel="stylesheet" href="pp.css">
  <link rel="stylesheet" href="watermark.css">
</head>
<body>
  <header>
    <h1>Our Jerseys Collection</h1>
    <nav class="navbar">
      <a href="index1.html">Home</a>
      <a href="products.html">Products</a>
      <a href="contact.html">Contact</a>
      <a href="#" class="cart-icon" onclick="openCart(); return false;">
        🛒 Cart
        <span class="cart-count">0</span>
      </a>
    </nav>
    <div class="sub-navbar">
      <a href="jorts.html">Jorts</a>
      <a href="jewelry.html">Jewelries</a>
      <a href="jersey.html" class="active">Jerseys</a>
    </div>
  </header>

  <section id="products">
    <div class="product">
      <h3>Goku Japan Jersey</h3>
      <img src="jerseys\Anime Soccer Jersey!New Style Arrival's.jpg" alt="Jersey 1">
      <p class="price">₦20,000</p>
      <button onclick="addToCart('Goku Japan Jersey', 20000, 'jerseys\\Anime Soccer Jersey!New Style Arrival\'s.jpg')">Add to Cart</button>
    </div>
    <div class="product">
      <h3>Pain Japan Polo Jersey</h3>
      <img src="jerseys\download.jpg" alt="Jersey 2">
      <p class="price">₦22,000</p>
      <button onclick="addToCart('Pain Japan Polo Jersey', 22000, 'jerseys\\download.jpg')">Add to Cart</button>
    </div>
    <div class="product">
      <h3>Itachi Japan Jersey</h3>
      <img src="jerseys\Screenshot_19-2-2026_201053_.jpeg" alt="Jersey 3">
      <p class="price">₦25,000</p>
      <button onclick="addToCart('Itachi Japan Jersey', 25000, 'jerseys\\Screenshot_19-2-2026_201053_.jpeg')">Add to Cart</button>
    </div>
    <div class="product">
      <h3>Retro Ac Milan Polo Jersey</h3>
      <img src="jerseys\Screenshot_20-2-2026_111259_.jpeg" alt="Jersey 4">
      <p class="price">₦28,000</p>
      <button onclick="addToCart('Retro Ac Milan Polo Jersey', 28000, 'jerseys\\Screenshot_20-2-2026_111259_.jpeg')">Add to Cart</button>
    </div>
  </section>

  <div id="cart-modal" class="cart-modal">
    <div class="cart-modal-content">
      <div class="cart-modal-header">
        <h2>🛒 Shopping Cart</h2>
        <button class="close-cart" onclick="closeCart()">&times;</button>
      </div>
      <div id="cart-items" class="cart-items">
        <p class="empty-cart">Your cart is empty!</p>
      </div>
      <div class="cart-modal-footer">
        <h3 id="cart-total">Total: ₦0</h3>
        <div class="cart-buttons">
          <button onclick="clearCart()" class="clear-cart-btn">Clear Cart</button>
          <button onclick="downloadReceipt()" class="receipt-btn">Download Receipt</button>
          <button onclick="checkout()" class="checkout-btn">Checkout</button>
        </div>
      </div>
    </div>
  </div>

  <script src="cart.js"></script>
  <script src="watermark.js"></script>
</body>
</html>
